services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: fundermatch
      POSTGRES_USER: fundermatch
      POSTGRES_PASSWORD: fundermatch-local-only
    ports:
      - "127.0.0.1:7444:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fundermatch -d fundermatch"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - fundermatch-postgres:/var/lib/postgresql/data

volumes:
  fundermatch-postgres:
