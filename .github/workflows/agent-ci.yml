name: Agent safety and recovery

on:
  pull_request:
  push:
    branches: [main]

jobs:
  deterministic-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - name: Validate production Compose syntax and trust boundaries
        run: |
          docker compose -f docker-compose.production.yml config --quiet
          uv run python scripts/validate_production_topology.py
      - run: uv run ruff check src tests scripts
      - name: Unit, guardrail, memory, recovery, and trace-leak gates
        run: uv run pytest -q

  docker-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: fundermatch
          POSTGRES_USER: fundermatch
          POSTGRES_PASSWORD: fundermatch-local-only
        ports: ["7444:5432"]
        options: >-
          --health-cmd "pg_isready -U fundermatch -d fundermatch"
          --health-interval 5s --health-timeout 5s --health-retries 20
      qdrant:
        image: qdrant/qdrant:v1.15.5
        ports: ["6999:6333"]
    env:
      FUNDERMATCH_DATABASE_URL: postgresql://fundermatch:fundermatch-local-only@localhost:7444/fundermatch
      FUNDERMATCH_QDRANT_URL: http://127.0.0.1:6999
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev
      - run: uv run fundermatch-migrate-workflow
      - run: uv run fundermatch-migrate-memory
      - name: PostgreSQL checkpoint restart and isolation tests
        run: >-
          uv run pytest -q tests/test_agent_postgres_integration.py
          tests/test_agent_memory.py tests/test_intake_jobs.py

  findociq-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - name: Checkout FinDocIQ public producer contract
        uses: actions/checkout@v4
        with:
          repository: somepalli/FinDocs_Analysis_Evals
          path: external/findociq
      - name: Validate development v1 and production v2 compatibility
        run: >-
          uv run python scripts/validate_findociq_contract.py
          --contract external/findociq/contracts/findociq-public-http-contract.json
      - name: Validate shared production service identity policy
        run: >-
          uv run fundermatch-service-identity verify-policy
          --findociq-policy external/findociq/configs/guardrails/production.yaml
